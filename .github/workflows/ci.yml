# CI: typecheck + tests + a real-host boot smoke on every push to main, every
# pull request, and a daily schedule.
#
# The @deepseek-ai/* packages are typechecked against the closure of a real
# dsh install, not just the registry devDependency pins: CI installs the dsh
# CLI from the rolling rc/stable line (the line this plugin targets — newest
# of the latest/next dist-tags, never alpha) and re-points every
# node_modules/@deepseek-ai entry at its closure (scripts/link-dsh-closure.mjs)
# before running tsc — so upstream drift fails the gate here instead of
# surfacing as a broken plugin on user machines.
#
# The smoke boots a scratch profile with the plugin mounted via the real dsh
# CLI (scripts/smoke-boot.mjs) so "loads under real cordis, registers the
# settings namespace, and serves the bundled skill" is a gate, not a hope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:23 UTC — catches upstream dsh rc/stable drift without hand-pinning.
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # Re-point every @deepseek-ai/* entry at the installed host's closure so
      # typecheck judges the code that actually runs inside dsh. No-op (exit 0)
      # when no global dsh is found, so a registry-only checkout still checks.
      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      - name: Check
        run: npm run check --if-present

      - name: Test
        run: npm test

      # dsh 的 profile/bundle 机器会转壳调用 pnpm 来初始化 scratch profile。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
